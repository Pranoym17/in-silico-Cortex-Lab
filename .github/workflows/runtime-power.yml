name: Manage AWS Runtime

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "AWS environment to manage"
        required: true
        type: choice
        options: [staging]
      action:
        description: "Wake starts the database and API. Sleep stops both after checking the queue."
        required: true
        type: choice
        options: [wake, sleep]
      confirmation:
        description: "Enter hibernate to sleep the runtime; leave blank to wake it."
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: cortex-lab-runtime-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: us-east-2
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
      - name: Sleep runtime
        if: inputs.action == 'sleep'
        run: |
          test "${{ inputs.confirmation }}" = "hibernate"
          PREFIX="cortex-lab-${ENVIRONMENT}"
          QUEUE_URL=$(aws sqs get-queue-url --queue-name "${PREFIX}-jobs" --query 'QueueUrl' --output text)
          ATTRIBUTES=$(aws sqs get-queue-attributes --queue-url "$QUEUE_URL" --attribute-names ApproximateNumberOfMessagesVisible ApproximateNumberOfMessagesNotVisible --output json)
          VISIBLE=$(echo "$ATTRIBUTES" | jq -r '.Attributes.ApproximateNumberOfMessagesVisible')
          IN_FLIGHT=$(echo "$ATTRIBUTES" | jq -r '.Attributes.ApproximateNumberOfMessagesNotVisible')
          test "$VISIBLE" = "0"
          test "$IN_FLIGHT" = "0"
          aws ecs update-service --cluster "$PREFIX" --service api --desired-count 0 >/dev/null
          aws ecs update-service --cluster "$PREFIX" --service worker --desired-count 0 >/dev/null
          aws ecs wait services-stable --cluster "$PREFIX" --services api worker
          aws rds stop-db-instance --db-instance-identifier "${PREFIX}-postgres" >/dev/null || true
          echo "Runtime is sleeping. The API will be unavailable until this workflow is run with action=wake."
      - name: Wake runtime
        if: inputs.action == 'wake'
        run: |
          PREFIX="cortex-lab-${ENVIRONMENT}"
          STATUS=$(aws rds describe-db-instances --db-instance-identifier "${PREFIX}-postgres" --query 'DBInstances[0].DBInstanceStatus' --output text)
          if [ "$STATUS" = "stopping" ]; then
            aws rds wait db-instance-stopped --db-instance-identifier "${PREFIX}-postgres"
            STATUS="stopped"
          fi
          if [ "$STATUS" = "stopped" ]; then
            aws rds start-db-instance --db-instance-identifier "${PREFIX}-postgres" >/dev/null
          fi
          aws rds wait db-instance-available --db-instance-identifier "${PREFIX}-postgres"
          aws application-autoscaling register-scalable-target --service-namespace ecs --resource-id "service/${PREFIX}/worker" --scalable-dimension ecs:service:DesiredCount --min-capacity 0 --max-capacity 1
          aws ecs update-service --cluster "$PREFIX" --service api --desired-count 1 >/dev/null
          aws ecs update-service --cluster "$PREFIX" --service worker --desired-count 0 >/dev/null
          aws ecs wait services-stable --cluster "$PREFIX" --services api
          echo "Runtime is awake. The worker will start on the next queued job."
